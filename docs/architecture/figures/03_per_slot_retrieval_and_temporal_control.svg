    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a5d84" x="80.64" y="642.237188" transform="rotate(-0 80.64 642.237188)">Public notes</text>
   </g>
   <g id="text_27">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6770" x="83.52" y="667.833125" transform="rotate(-0 83.52 667.833125)">- Candidate identity is deduplicated within a slot.</text>
   </g>
   <g id="text_28">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6770" x="83.52" y="693.753125" transform="rotate(-0 83.52 693.753125)">- A physical record may remain relevant to multiple logical slots.</text>
   </g>
   <g id="text_29">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6770" x="83.52" y="719.673125" transform="rotate(-0 83.52 719.673125)">- Exact production ranking and weighting logic are not released.</text>
